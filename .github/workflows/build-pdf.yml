name: Compile Typst to PDF

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compile Typst Document
        run: bash scripts/typst.sh compile beregninger/beregning.typ beregning.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: compiled-pdf
          path: beregning.pdf
          if-no-files-found: error
