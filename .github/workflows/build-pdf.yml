name: Compile Typst to PDF

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore PDF
        id: pdf-cache
        uses: actions/cache@v5
        with:
          path: beregning.pdf
          key: beregning-pdf-${{ runner.os }}-${{ hashFiles('beregninger/**', 'tools/typst/**', '.github/workflows/build-pdf.yml') }}

      - name: Compile Typst Document
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        working-directory: beregninger
        run: bash typst.sh compile beregning.typ ../beregning.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: compiled-pdf
          path: beregning.pdf
          if-no-files-found: error
          retention-days: 90
