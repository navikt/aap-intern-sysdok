name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  diagrams:
    uses: ./.github/workflows/plantuml-diagrams.yml
    permissions:
      contents: read

  beregning-pdf:
    uses: ./.github/workflows/build-pdf.yml
    permissions:
      contents: read

  presentasjon-pdf:
    uses: ./.github/workflows/presentasjon-kelvin.yml
    permissions:
      contents: read

  build:
    needs: [diagrams, beregning-pdf, presentasjon-pdf]
    permissions:
      contents: read        # checkout code
      id-token: write       # nais/docker-build-push
      packages: write       # nais/docker-build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Download diagrams
        uses: actions/download-artifact@v8
        with:
          name: plantuml-diagrams
          path: static/generated-diagrams

      - name: Download presentasjon-kelvin PDF
        uses: actions/download-artifact@v8
        with:
          name: presentasjon-kelvin
          path: static/presentasjoner

      - name: Keep presentation URL
        run: mv static/presentasjoner/presentasjon.pdf static/presentasjoner/presentasjon-kelvin.pdf

      - name: Download kelvin-beregning PDF
        uses: actions/download-artifact@v8
        with:
          name: compiled-pdf
          path: static/beregninger

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: |
          git log --pretty=format:"## %s (%ad)%n" --date=short --name-only -- '*.md' > docs/Endringslogg.md
          yarn build

      - name: Push Docker image to GAR and sign image
        if: (github.event.action == 'closed' && github.event.pull_request.merged == true) || (github.ref_name == 'main')
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: aap
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    if: (github.event.action == 'closed' && github.event.pull_request.merged == true) || (github.ref_name == 'main')
    steps:
      - uses: actions/checkout@v7
      - uses: nais/deploy/actions/deploy@v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/nais.yml
          VAR: image=${{ needs.build.outputs.image }}
