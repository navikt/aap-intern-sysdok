name: Generate PlantUML Diagrams

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore diagrams
        id: diagrams-cache
        uses: actions/cache@v5
        with:
          path: generated-diagrams
          key: plantuml-${{ runner.os }}-${{ hashFiles('diagrams/**', '.github/workflows/plantuml-diagrams.yml') }}

      - name: Set up Java
        if: steps.diagrams-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Download PlantUML JAR
        if: steps.diagrams-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install graphviz
          mkdir -p tools
          curl --fail --show-error --location https://github.com/plantuml/plantuml/releases/download/v1.2025.2/plantuml-1.2025.2.jar -o tools/plantuml.jar

      - name: Generate PNG diagrams
        if: steps.diagrams-cache.outputs.cache-hit != 'true'
        run: |
          echo "## Oppsummering" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p generated-diagrams
          find diagrams -name "*.puml" -type f -print0 | while IFS= read -r -d '' file; do
            echo "Processing $file"
            java -jar tools/plantuml.jar -failfast2 -tpng "$file" -o "$(pwd)/generated-diagrams"
          done

      - name: Upload diagrams as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plantuml-diagrams
          path: generated-diagrams
          if-no-files-found: error
          retention-days: 90
