name: Bygg presentasjon-kelvin

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-presentasjon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hent lagret PDF
        id: pdf-cache
        uses: actions/cache@v5
        with:
          path: presentasjon-kelvin/presentasjon.pdf
          key: presentasjon-pdf-${{ runner.os }}-${{ hashFiles('presentasjon-kelvin/**', '.github/workflows/presentasjon-kelvin.yml') }}

      - name: Bygg PDF i Docker
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        working-directory: presentasjon-kelvin
        run: ./build.sh --docker presentasjon.org

      - name: Last opp PDF
        uses: actions/upload-artifact@v7
        with:
          name: presentasjon-kelvin
          path: presentasjon-kelvin/presentasjon.pdf
          if-no-files-found: error
